name: BIRD

on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild and overwrite image tags
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bird-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/bird" >> "$GITHUB_ENV"
      - name: Detect new BIRD 3 package or build changes
        id: version
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--image "$IMAGE")
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 bird/check-version.py "${args[@]}"
      - name: Set up Docker Buildx
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: steps.version.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        if: steps.version.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./bird
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIRD_VERSION=${{ steps.version.outputs.upstream }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.upstream }}
            ${{ env.IMAGE }}:3
            ${{ env.IMAGE }}:latest
      - name: Report result
        env:
          BUILD_TAG: ${{ steps.version.outputs.tag }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if [[ "$BUILD" == true ]]; then
            echo "Published $IMAGE:$BUILD_TAG (amd64 + arm64)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$IMAGE:$BUILD_TAG already exists; skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
