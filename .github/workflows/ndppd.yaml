name: Build ndppd

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag (leave empty for the latest release, including pre-releases)'
        required: false
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - name: Resolve upstream version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            upstream_tags="$(gh api --paginate 'repos/DanielAdolfsson/ndppd/tags?per_page=100' --jq '.[].name')"
            version="$REQUESTED_VERSION"
            if ! grep -Fxq -- "$version" <<< "$upstream_tags"; then
              if [[ "$version" == v* ]]; then
                version="${version#v}"
              else
                version="v$version"
              fi
              if ! grep -Fxq -- "$version" <<< "$upstream_tags"; then
                echo "Upstream tag not found: $REQUESTED_VERSION" >&2
                exit 1
              fi
            fi
          else
            version="$(gh api --paginate --slurp 'repos/DanielAdolfsson/ndppd/releases?per_page=100' \
              | jq -r 'add | map(select(.draft == false and .published_at != null)) | max_by(.published_at) | .tag_name // empty')"
          fi
          if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "No valid upstream version found: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo 'tags<<EOF'
            echo "type=raw,value=$version"
            if [[ -z "$REQUESTED_VERSION" ]]; then
              echo 'type=raw,value=latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build-arm64:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Cross-compile arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ndppd
          platforms: linux/arm64
          tags: ndppd:verify
          build-args: NDPPD_VERSION=${{ needs.resolve.outputs.version }}
          outputs: type=docker,dest=ndppd-arm64.tar
      - uses: actions/upload-artifact@v7
        with:
          name: ndppd-arm64
          path: ndppd-arm64.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-arm64:
    needs: build-arm64
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ndppd-arm64
      - name: Load cross-compiled image
        run: docker load --input ndppd-arm64.tar
      - name: Verify startup on arm64
        run: |
          set -euo pipefail
          container="$(docker run -d --network none --cap-drop ALL --cap-add NET_ADMIN --cap-add NET_RAW \
            -e IPV6_SUBNET=2001:db8:1::/64 -e PROXY_IFACE=lo -e FWD_IFACE=lo ndppd:verify)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          sleep 1
          [[ "$(docker inspect --format '{{.State.Status}}' "$container")" == running ]]
          docker stop --time 3 "$container"
          [[ "$(docker inspect --format '{{.State.ExitCode}}' "$container")" == 0 ]]
          docker logs "$container" | grep -F 'Loading configuration "/etc/ndppd.conf"'

  build:
    needs: [resolve, verify-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/ndppd
          tags: ${{ needs.resolve.outputs.tags }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: ndppd
          platforms: linux/amd64,linux/arm64
          build-args: NDPPD_VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
