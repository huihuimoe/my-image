name: Build zerotier

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag (leave empty for the latest release)'
        required: false
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - name: Resolve upstream version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            upstream_tags="$(gh api --paginate 'repos/zerotier/ZeroTierOne/tags?per_page=100' --jq '.[].name')"
            version="$REQUESTED_VERSION"
            if ! grep -Fxq -- "$version" <<< "$upstream_tags"; then
              if [[ "$version" == v* ]]; then
                version="${version#v}"
              else
                version="v$version"
              fi
              if ! grep -Fxq -- "$version" <<< "$upstream_tags"; then
                echo "Upstream tag not found: $REQUESTED_VERSION" >&2
                exit 1
              fi
            fi
          else
            version="$(gh api 'repos/zerotier/ZeroTierOne/releases/latest' --jq '.tag_name // empty')"
          fi
          if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "No valid upstream version found: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo 'tags<<EOF'
            echo "type=raw,value=$version"
            if [[ -z "$REQUESTED_VERSION" ]]; then
              echo 'type=raw,value=latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/zerotier
          tags: ${{ needs.resolve.outputs.tags }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: zerotier
          platforms: linux/amd64,linux/arm64
          build-args: ZT_VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
